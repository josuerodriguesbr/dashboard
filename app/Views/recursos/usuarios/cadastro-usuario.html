
<form id="formCadastroUsuario" class="conteudo-centralizado" autocomplete="off" novalidate>

    <!-- Campos fictícios ocultos para evitar autofill do navegador -->
    <div style="position: absolute; left: -9999px; top: -9999px; height: 0; overflow: hidden;">
        <input type="text" name="fake-username" autocomplete="username">
        <input type="password" name="fake-password" autocomplete="current-password">
    </div>

    <div class="campoDeTexto">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
    </div> 

    <div class="campoDeEmail">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="email@empresa.com" required
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>   
    
    <div class="campoDeSenha">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required
               autocomplete="new-password" autocapitalize="off" spellcheck="false">               
    </div>    

    <div class="campoDeCPF">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="CPF">
    </div>

    <div class="campoDeTelefone">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-8888">
    </div>
    <div class="campoDeOpcoes">
        <label for="nivel">Tipo de Usuário</label>
        <select name="nivel" id="nivel" required>
            <option value="">Selecione um tipo</option>
            <option value="admin">Administrador</option>
            <option value="assinante">Assinante</option>
            <option value="vendedor">Vendedor</option>
            <option value="cliente" selected>Cliente</option>
        </select>
    </div>

    <div class="grade-botao">
        <div></div> <!-- Célula vazia -->
            <button type="submit" class="btn-primary">Cadastrar</button>
        <div></div> <!-- Célula vazia -->
    </div>    

    <div class="status" id="status"></div>
</form>
