<form id="formPerfilUsuario" class="conteudo-centralizado" autocomplete="off" novalidate>

        <input type="hidden" id="id" name="id">
        <div class="campoDeTexto">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
        </div>

        <div class="campoDeEmail">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="email@empresa.com" required autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>

        <div class="campoDeSenha">
            <label for="senha">Senha (deixe em branco para manter a atual)</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua nova senha">
        </div>

        <div class="campoDeCPF">
            <label for="cpf">CPF/CNPJ</label>
            <input type="text" id="cpf" name="cpf" placeholder="CPF ou CNPJ">
        </div>

        <div class="campoDeTelefone">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-8888">
        </div>

        <!-- Removido o campo nivel pois agora usamos o sistema de perfis
        <div class="campoDeOpcoes">
            <label for="nivel">Tipo de Usuário</label>
            <select name="nivel" id="nivel" required>
                <option value="">Selecione um tipo</option>
                <option value="admin">Administrador</option>
                <option value="assinante">Assinante</option>
                <option value="operador">Operador</option>
                <option value="vendedor">Vendedor</option>
                <option value="cliente">Cliente</option>
            </select>
        </div>
        -->

        <div class="grade-botao">
            <div></div>
            <button type="submit" class="btn-primary">Atualizar Perfil</button>
            <div></div>
        </div>

        <div class="status" id="status"></div>
</form>
